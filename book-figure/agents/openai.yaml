interface:
  display_name: "Book Figure"
  short_description: "Create atlas-guided scientific figures and ref redraws"
  default_prompt: "Use $book-figure with its visual biological-object atlas plus the default genereg + detailed modes. Select exact objects or complexes first, build an object-only atlas montage, and use category/contact fallbacks for missing objects. Use Inter for ordinary text, Roboto Mono only for displayed nucleotide sequences, and pure black #000000 for every visible text glyph. Use ref mode when the supplied source provides scientific facts only. Use atlas-debug to report reference selection without calling ImageGen."
